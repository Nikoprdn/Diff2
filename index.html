<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIFF A — Externe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mono:'Share Tech Mono',monospace; --display:'Oswald',sans-serif;
    --bg:#111214; --s1:#1a1c1f; --s2:#212428; --s3:#181a1d;
    --border:#2e3238; --cyan:#b0bec5; --cyan-dim:#78909c;
    --green:#66bb6a; --green-dk:#2e4a2e;
    --yellow:#ffa726; --orange:#ef6c00; --red:#ef5350;
    --txt:#cfd8dc; --txt-dim:#607d8b; --txt-mute:#37474f;
  }
  html,body{background:var(--bg)!important;min-height:100vh;overflow-x:hidden;width:100%;}
  .navbar.is-console{background:var(--s1);border-bottom:1px solid var(--border);}
  .navbar-brand .navbar-item{font-family:var(--display);font-size:20px;font-weight:700;color:var(--cyan);letter-spacing:2px;}
  .clock-display{font-family:var(--mono);font-size:22px;color:var(--cyan);letter-spacing:3px;}
  .section.is-console{padding:1rem;background:var(--bg);}
  .card.is-dark-card{background:var(--s1);border:1px solid var(--border);border-radius:8px;box-shadow:none;position:relative;}
  .card.is-dark-card .card-header{background:var(--s2);border-bottom:1px solid var(--border);box-shadow:none;border-radius:8px 8px 0 0;}
  .card.is-dark-card .card-content{padding:0;}
  .card.is-dark-card .card-footer{background:var(--s3);border-top:1px solid var(--border);border-radius:0 0 8px 8px;padding:.6rem 1rem;gap:1rem;}
  .card.is-dark-card .card-footer-item{color:var(--txt-dim);font-family:var(--mono);font-size:11px;border:none;padding:0;justify-content:flex-start;}
  .diff-badge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;padding:2px 10px;border-radius:4px;}
  .notification.is-onair{background:var(--s2);border:1px solid var(--border);border-top:none;border-radius:0;padding:.5rem 1rem;margin:0;display:flex;align-items:center;justify-content:space-between;transition:background .2s,border-color .2s;}

  /* EN DIRECT — full rouge */
  .diff-card-header.is-live{background:#1a0000!important;border-bottom-color:#cc0000!important;}
  .diff-card-header.is-live .diff-badge{background:#cc0000!important;color:#fff!important;border-color:#ff2020!important;}
  .diff-onair-bar.is-live{background:#1a0000!important;border-color:#cc0000!important;}
  .diff-onair-bar.is-live .onair-title{color:#ff2020!important;}
  .diff-onair-bar.is-live .dot-live{background:#ff0000!important;box-shadow:0 0 8px #ff0000!important;animation:live-pulse .8s ease-in-out infinite!important;}
  .card.is-dark-card.diff-is-live{border-color:#cc0000!important;box-shadow:none!important;background:#100000!important;}
  .card.is-dark-card.diff-is-live .card-header{background:#1a0000!important;border-bottom-color:#cc0000!important;}
  @keyframes live-pulse{0%,100%{opacity:1;box-shadow:0 0 10px #ff0000;}50%{opacity:.5;box-shadow:0 0 4px #ff0000;}}
  .diff-progress-fill{background:#cc0000!important;transition:width .08s linear;}
  .table.is-radio tbody tr.row-active{background:#1a0000!important;border-left:4px solid #ff0000!important;border-top:1px solid #880000!important;border-bottom:1px solid #880000!important;}
  .table.is-radio tbody tr.row-active::before{background:#cc0000!important;}
  .table.is-radio tbody tr.row-active::after{
    content:'';position:absolute;top:0;bottom:0;
    left:var(--out-pct,100%);width:3px;
    background:#ff8800;z-index:4;pointer-events:none;
    box-shadow:0 0 6px #ff8800;
  }
  .onair-title{font-family:var(--display);font-size:22px;font-weight:700;color:var(--txt);letter-spacing:3px;}
  .onair-track-name{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:2px;color:var(--yellow);margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px;}
  .dot-live{display:inline-block;width:8px;height:8px;background:var(--red);border-radius:50%;animation:blink 1s step-start infinite;vertical-align:middle;margin-right:6px;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .timer-group{display:flex;gap:1rem;align-items:center;margin-left:auto;padding-right:1rem;}
  .timer-box{text-align:center;}
  .timer-box .label-txt{font-family:var(--mono);font-size:8px;color:var(--txt-dim);letter-spacing:1px;text-transform:uppercase;display:block;}
  .timer-box .val-txt{font-family:var(--mono);font-size:15px;letter-spacing:1px;line-height:1;display:block;}

  /* Table */
  .table.is-radio{background:transparent;width:100%;}
  .table.is-radio thead th{background:var(--s3);color:var(--txt-mute);font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;border-color:var(--border)!important;padding:6px 10px;font-weight:400;}
  .table.is-radio tbody tr{border-bottom:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;}
  .table.is-radio tbody tr:hover td{background:#0e1830;}
  .table.is-radio tbody td{border-color:var(--border)!important;color:var(--txt-dim);padding:0 10px;height:56px;vertical-align:middle;white-space:nowrap;}
  .table.is-radio tbody tr.row-active{background:linear-gradient(90deg,#180303 0%,#0c0303 100%);border-left:4px solid #ff2020;border-top:1px solid #6a1010;border-bottom:1px solid #6a1010;}
  .table.is-radio tbody tr.row-active td{height:96px;vertical-align:middle;position:relative;z-index:2;}
  .table.is-radio tbody tr.row-active::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(180,10,10,.85) 0%,rgba(80,5,5,.5) 100%);z-index:0;transform-origin:left;transform:scaleX(var(--prog,0));transition:transform 0.05s linear;}
  .row-active-wv-bg{position:absolute;inset:0;z-index:1;width:100%;height:100%;opacity:0.55;pointer-events:none;display:block;}
  .row-active-title{font-family:var(--display);font-size:22px;font-weight:700;color:#ffffff;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.8);position:relative;z-index:3;}
  .row-active-tc{font-family:var(--mono);font-size:13px;color:#ff4040;letter-spacing:1px;font-weight:700;position:relative;z-index:3;}
  .row-active-dur{font-family:var(--mono);font-size:11px;color:#7a9ab8;position:relative;z-index:3;}
  .row-active-time{font-family:var(--mono);font-size:11px;color:var(--cyan-dim);position:relative;z-index:3;}
  .row-active-cues{font-family:var(--mono);font-size:8px;color:rgba(0,212,240,.6);letter-spacing:1px;position:relative;z-index:3;margin-top:2px;}
  .table.is-radio tbody tr.row-next{background:#071408;border-left:3px solid var(--green-dk);}
  .cell-num{width:36px;font-family:var(--mono);font-size:12px;text-align:center;}
  .cell-num.is-playing{color:var(--red)!important;}
  .cell-time{width:80px;font-family:var(--mono);font-size:11px;color:var(--cyan-dim)!important;}
  .cell-sub{font-size:9px;color:var(--txt-mute)!important;display:block;}
  .cell-title{min-width:120px;max-width:160px;}
  .cell-simple{font-size:12px;color:#7a98b8!important;overflow:hidden;text-overflow:ellipsis;display:block;max-width:150px;}
  .row-active .cell-simple{color:#ff6060!important;}
  .row-active .cell-num{color:#ff4040!important;}
  .row-next .cell-simple{color:#40d870!important;}
  .cell-dur{width:64px;font-family:var(--mono);font-size:11px;text-align:right;}
  .cell-cd{width:84px;font-family:var(--mono);font-size:12px;text-align:right;padding-right:10px!important;}
  .cell-bar{width:5px;padding:0!important;}
  .color-bar{height:56px;width:5px;display:block;}

  /* Boutons */
  .button{font-family:var(--mono)!important;font-size:11px!important;letter-spacing:1px!important;border-radius:2px!important;}
  .button.is-dark{background:transparent!important;border-color:var(--border)!important;color:var(--txt-dim)!important;}
  .button.is-dark:hover{border-color:var(--cyan-dim)!important;color:var(--txt)!important;}
  .button.is-success{background:transparent!important;border-color:var(--green)!important;color:var(--green)!important;}
  .button.is-success:hover{background:#052210!important;}
  .button.is-danger{background:transparent!important;border-color:var(--red)!important;color:var(--red)!important;}
  .button.is-danger:hover{background:#200808!important;}
  .button.is-auto{background:transparent!important;border-color:var(--border)!important;color:var(--txt-dim)!important;transition:all .15s!important;}
  .button.is-auto.active{background:#0a2a00!important;border-color:var(--green)!important;color:var(--green)!important;}
  .tag{font-family:var(--mono)!important;font-size:10px!important;letter-spacing:1px!important;border-radius:2px!important;}

  /* Drop zone */
  .file-drop-zone{border:1px dashed var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s;text-align:center;margin:6px 10px;}
  .file-drop-zone:hover,.file-drop-zone.drag-over{border-color:var(--cyan-dim);background:#0a1830;}
  .file-drop-zone input[type=file]{display:none;}
  .fdz-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .fdz-icon{font-family:var(--mono);font-size:13px;color:var(--cyan-dim);}
  .fdz-text{font-family:var(--mono);font-size:10px;color:var(--txt-dim);letter-spacing:1px;}
  .fdz-count{font-family:var(--mono);font-size:9px;color:var(--cyan);}
  .fdz-add-badge{font-family:var(--mono);font-size:9px;color:var(--green);background:#052210;border:1px solid var(--green-dk);border-radius:3px;padding:1px 6px;margin-left:4px;}

  /* VU strip */
  .vu-strip{position:absolute;top:0;right:-9px;bottom:0;width:7px;border-radius:0 4px 4px 0;display:flex;flex-direction:column-reverse;gap:1px;padding:2px 0;overflow:hidden;z-index:5;background:rgba(6,11,22,.9);border:1px solid var(--border);border-left:none;}
  .vu-strip-bar{width:100%;border-radius:1px;min-height:2px;flex:1;opacity:0.08;transition:opacity .05s ease-out;}

  /* Barre de progression */
  .diff-progress-wrap{position:relative;height:4px;background:#222428;overflow:hidden;}
  .diff-progress-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,#ef5350,#ffa726,#66bb6a);transition:width .08s linear;}

  /* Voyant RC */
  @keyframes blink-ext{0%,100%{opacity:1}50%{opacity:.3}}
  #rc-status-dot.connected{animation:none!important;}

  /* Statut connexion */
  #sig-status-bar{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:6px 1rem;background:#0e1012;border-bottom:1px solid #222428;display:flex;align-items:center;gap:12px;}
  .sig-dot{width:8px;height:8px;border-radius:50%;background:#ef5350;flex-shrink:0;transition:background .3s;}
  .sig-dot.on{background:#66bb6a;box-shadow:0 0 6px #66bb6a;}

  /* Waveform sur les lignes normales */
  .wv-handle{position:absolute;top:0;bottom:0;width:3px;cursor:ew-resize;z-index:4;transform:translateX(-1.5px);}
  .wv-handle-in{background:#66bb6a;}
  .wv-handle-out{background:#ef5350;}
  .wv-handle::after{content:'';position:absolute;top:0;bottom:0;left:-8px;right:-8px;}
  .wv-edit-btn{position:absolute;bottom:3px;right:3px;z-index:6;background:rgba(20,22,26,.85);border:1px solid #2e3238;color:#607d8b;font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;cursor:pointer;letter-spacing:1px;}
  .wv-edit-btn:hover{border-color:#78909c;color:#b0bec5;}

  /* Intro badge */
  .intro-badge{font-family:var(--mono);font-size:7px;background:#2a2000;color:#f5c400;border:1px solid #6a5000;border-radius:2px;padding:1px 4px;letter-spacing:1px;}
  .intro-countdown{font-family:var(--mono);font-size:22px;color:#f5c400;letter-spacing:2px;line-height:1;}
  .cd-sublabel{font-family:var(--mono);font-size:8px;letter-spacing:2px;}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG — DIFF A Externe
// ═══════════════════════════════════════════════════════
const CONFIGS=[
  {
    tracks:[],
    ids:{avant:'d2-avant',avance:'d2-avance',counter:'d2-counter',
         body:'d2-body',micros:'d2-micros',total:'d2-total',suffix:'d2-suffix',progress:'d2-progress'},
    fdzCount:'d2-fdz-count', autoBtn:'d2-auto-btn'
  }
];

const WV_DATA_CACHE={};

// ═══════════════════════════════════════════════════════
// SIGNALING CLOUDFLARE — réception des commandes de RC
// ═══════════════════════════════════════════════════════
const SIG_URL  = 'https://radio-signaling.nicolas7lejeune.workers.dev';
const SIG_ROLE = 'd2'; // ce côté = Diffuseur Externe

let _rcOnline = false;

function _rcSetStatus(online, method=''){
  const dot = document.getElementById('rc-status-dot');
  const lbl = document.getElementById('rc-status-lbl');
  if(dot){
    dot.style.background = online ? '#00d96a' : '#e03020';
    dot.style.boxShadow  = online ? '0 0 8px #00d96a' : '0 0 8px #e03020';
    dot.classList.toggle('connected', online);
    dot.style.animation  = online ? 'none' : 'blink-ext .8s step-start infinite';
  }
  if(lbl){ lbl.textContent = online ? ('RC ● '+(method||'')) : 'RC ✗'; lbl.style.color = online ? '#00d96a' : '#e03020'; }
  const dot2 = document.getElementById('sig-dot');
  const txt  = document.getElementById('sig-txt');
  const last = document.getElementById('sig-last');
  if(dot2) dot2.classList.toggle('on', online);
  if(txt)  txt.textContent  = online ? 'Cloudflare connecté' : 'En attente de RC…';
  if(last) last.textContent = 'Dernier contact : '+nowClock();
}

async function sigSend(msg){
  try{
    await fetch(`${SIG_URL}/send?from=d2&to=rc`,{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(msg)
    });
  }catch(e){ console.warn('[Sig] send error:',e.message); }
}

async function sigPoll(){
  try{
    const r=await fetch(`${SIG_URL}/poll?role=d2`);
    if(!r.ok) return;
    const data=await r.json();
    for(const msg of (data.messages||[])) sigHandleMessage(msg);
  }catch(e){}
}

async function sigHeartbeat(){
  try{
    await fetch(`${SIG_URL}/heartbeat?role=d2`,{method:'POST'});
    // Vérifier si RC est en ligne
    const r=await fetch(`${SIG_URL}/status`);
    if(r.ok){
      const s=await r.json();
      const wasOnline=_rcOnline;
      _rcOnline=s.rc?.online||false;
      if(_rcOnline!==wasOnline) _rcSetStatus(_rcOnline,'Cloudflare');
    }

}

function sigHandleMessage(msg){
  if(!msg||!msg.action) return;
  _rcSetStatus(true,'Cloudflare');
  switch(msg.action){
    case 'play':
      if(D[0]&&!D[0].playing) D[0].togglePlay();
      break;
    case 'stop':
      if(D[0]&&D[0].playing) D[0].stopAll();
      break;
    case 'd2-pong':
      _rcSetStatus(true,'Cloudflare');
      break;
    // RC demande à Diff2 de lancer RACCRO EXT (pour faire jouer RC depuis Diff2)
    case 'raccro-ext':
      // Impossible depuis Diff2 — c'est Diff2 qui déclenche RC
      break;
    default:
      if(msg.action==='ping'||msg.action==='d2-ping'){
        sigSend({action:'pong',source:'D2'});
      }
  }
}

// ── Poignées IN/OUT sur les lignes normales (Diff2) ──
function _bindHandlesD2(wvId,trackIdx){
  const wrap=document.querySelector(`#${wvId}`)?.parentElement;
  const inH=document.getElementById(wvId+'-in');
  const outH=document.getElementById(wvId+'-out');
  if(!wrap||!inH||!outH)return;
  const xToR=(clientX)=>{const rect=wrap.getBoundingClientRect();return Math.min(1,Math.max(0,(clientX-rect.left)/rect.width));};
  const applyIn=(sec)=>{const dur=D[0].durs[trackIdx]||1;const pct=(sec/dur*100).toFixed(2);inH.style.left=pct+'%';const pre=document.getElementById(wvId+'-pre');if(pre)pre.style.width=pct+'%';};
  const applyOut=(sec)=>{const dur=D[0].durs[trackIdx]||1;const pct=(sec/dur*100).toFixed(2);outH.style.left=pct+'%';const post=document.getElementById(wvId+'-post');if(post)post.style.left=pct+'%';};
  const bindOne=(handle,type)=>{
    let active=false;
    handle.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();active=true;document.body.style.userSelect='none';},{passive:false});
    document.addEventListener('mousemove',e=>{
      if(!active)return;
      const t=D[0].tracks[trackIdx];if(!t)return;
      const dur=D[0].durs[trackIdx]||1,sec=xToR(e.clientX)*dur;
      if(type==='in'){t.inCue=Math.max(0,Math.min(sec,(t.outCue??dur)-0.1));applyIn(t.inCue);}
      else{t.outCue=Math.min(dur,Math.max(sec,(t.inCue||0)+0.1));applyOut(t.outCue);}
    });
    document.addEventListener('mouseup',()=>{
      if(!active)return;active=false;document.body.style.userSelect='';
      const cv=document.getElementById(wvId);const file=D[0].tracks[trackIdx]?.file;
      if(cv&&file&&WV_DATA_CACHE[file])drawWaveformFromData(cv,WV_DATA_CACHE[file],0,1);
    });
  };
  bindOne(inH,'in');bindOne(outH,'out');
}

const fmt2=n=>String(n).padStart(2,'0');
function fmtFull(s){if(!isFinite(s)||s<0)s=0;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);return fmt2(h)+':'+fmt2(m)+':'+fmt2(sec);}
function fmtMs(s){if(!isFinite(s)||s<0)s=0;return fmt2(Math.floor(s/60))+':'+fmt2(Math.floor(s%60));}
function nowClock(){const n=new Date();return fmt2(n.getHours())+':'+fmt2(n.getMinutes())+':'+fmt2(n.getSeconds());}
let _lastClockSec=-1;

// ═══════════════════════════════════════════════════════
// WAVEFORM (allégée — pas d'éditeur IN/OUT modal sur Diff2)
// ═══════════════════════════════════════════════════════
async function drawWaveform(canvas,file){
  try{
    const resp=await fetch(file);const buf=await resp.arrayBuffer();
    const offCtx=new OfflineAudioContext(1,1,44100);const ab=await offCtx.decodeAudioData(buf);
    const rawData=ab.getChannelData(0);WV_DATA_CACHE[file]=rawData;
    drawWaveformFromData(canvas,rawData,0,1);return ab.duration;
  }catch(e){console.warn('waveform',e);return 0;}
}
function drawWaveformFromData(canvas,data,startRatio=0,endRatio=1){
  const W=canvas.width,H=canvas.height;const c=canvas.getContext('2d');
  // Fond gris ardoise plein pour Diff2
  c.fillStyle='#8fa8b0';
  c.fillRect(0,0,W,H);
  const start=Math.floor(startRatio*data.length),end=Math.floor(endRatio*data.length);
  const len=Math.max(1,end-start),step=Math.max(1,Math.floor(len/W));
  for(let x=0;x<W;x++){
    let mn=0,mx=0;const base=start+x*step;
    for(let j=0;j<step;j++){const v=data[base+j]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
    const amp=Math.max(Math.abs(mn),Math.abs(mx));
    const y1=Math.round((1+mn)*H/2),y2=Math.round((1+mx)*H/2);
    const h=Math.max(1,y2-y1);
    const alpha=0.25+amp*0.75;
    c.fillStyle=`rgba(20,28,32,${alpha.toFixed(2)})`;
    c.fillRect(x,y1,1,h);
  }
  c.fillStyle='rgba(40,60,70,0.2)';
  c.fillRect(0,Math.floor(H/2),W,1);
}
function drawWaveformBg(canvas,data){
  const W=canvas.width||1200,H=canvas.height||96;const c=canvas.getContext('2d');c.clearRect(0,0,W,H);
  const step=Math.max(1,data.length/W);
  c.fillStyle='rgba(255,255,255,0.08)';c.beginPath();c.moveTo(0,H/2);
  for(let x=0;x<W;x++){let mx=0;const base=Math.floor(x*step);for(let j=0;j<Math.ceil(step);j++){const v=Math.abs(data[base+j]||0);if(v>mx)mx=v;}c.lineTo(x,H/2-mx*(H/2)*.9);}
  for(let x=W-1;x>=0;x--){let mx=0;const base=Math.floor(x*step);for(let j=0;j<Math.ceil(step);j++){const v=Math.abs(data[base+j]||0);if(v>mx)mx=v;}c.lineTo(x,H/2+mx*(H/2)*.9);}
  c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,0.45)';c.lineWidth=1;
  for(let x=0;x<W;x++){
    let mn=0,mx=0;const base=Math.floor(x*step);
    for(let j=0;j<Math.ceil(step);j++){const v=data[base+j]||0;if(v<mn)mn=v;if(v>mx)mx=v;}
    const y1=Math.round((1+mn)/2*H),y2=Math.round((1+mx)/2*H);
    if(y2>y1){c.beginPath();c.moveTo(x+.5,y1);c.lineTo(x+.5,y2);c.stroke();}
  }
}

class Diffuser{
  constructor(cfg,diffIdx){
    this.cfg=cfg;this.idx=diffIdx;this.ids=cfg.ids;
    this.tracks=[];this.durs=[];this.audios=[];
    this.playing=false;this.ci=0;this.auto=false;
    this._chainDone=new Set();this._playToken=0;
    this._outTimer=null;this._removeTimer=null;
    this._stopAfterMacro=false;
  }
  addTracks(newTracks){
    const insertAt=this._insertionIndex();
    this.tracks.splice(insertAt,0,...newTracks);this.durs.splice(insertAt,0,...newTracks.map(()=>0));this.audios.splice(insertAt,0,...newTracks.map(()=>null));
    newTracks.forEach((_,ni)=>{
      const idx=insertAt+ni;const a=new Audio();a.src=this.tracks[idx].file;
      a.addEventListener('loadedmetadata',()=>{
        const ci=this.tracks.indexOf(this.tracks[idx]);const realIdx=ci!==-1?ci:idx;
        this.durs[realIdx]=a.duration||0;
        if(this.tracks[realIdx]&&(this.tracks[realIdx].outCue===null||this.tracks[realIdx].outCue===undefined))this.tracks[realIdx].outCue=a.duration;
        this.render();
      });
      this.audios[idx]=a;
    });
    this.render();
    if(this.playing&&!this.audios.some(a=>a&&!a.paused)){this.ci=0;this._startTrack(0);}
  }
  _insertionIndex(){let i=this.tracks.length;while(i>0&&this.tracks[i-1]?.pinned)i--;return i;}
  _inOf(i){return Math.max(0,this.tracks[i]?.inCue||0);}
  _outOf(i){const t=this.tracks[i];if(!t)return 0;return t.outCue!==null?t.outCue:this.durs[i]||0;}
  _playDur(i){return Math.max(0,this._outOf(i)-this._inOf(i));}
  _introOf(i){const t=this.tracks[i];if(!t)return null;return(t.introCue!==undefined&&t.introCue!==null)?t.introCue:null;}

      const delBtn=t.pinned?'':`<button onclick="event.stopPropagation();diffRemoveTrack(0,${i})" style="background:transparent;border:none;color:#3a4050;cursor:pointer;font-size:11px;padding:0 4px;line-height:1" onmouseover="this.style.color='#e03020'" onmouseout="this.style.color='#3a4050'">✕</button>`;

    if(trackNameEl){const activeTrack=this.playing&&this.tracks[this.ci];trackNameEl.textContent=activeTrack?'— '+activeTrack.title:'';trackNameEl.style.opacity=activeTrack?'1':'0';}
    const hdr=document.getElementById('diff-header-0');const bar=document.getElementById('diff-onair-0');

  tick(){
    if(!this.playing||!this.tracks.length)return;
    const i=this.ci;const t=this.tracks[i];if(!t||t.isMacro)return;
    const audio=this.audios[i];if(!audio)return;
    const pos=audio.currentTime;
    const inCue=this._inOf(i),outCue=this._outOf(i),fileDur=this.durs[i]||1;
    const progFull=Math.max(0,Math.min(1,(pos-inCue)/(fileDur-inCue||1)));
    const tr=document.getElementById(this.ids.body)?.querySelector('tr.row-active');
    if(tr){
      tr.style.setProperty('--prog',progFull);
      tr.style.setProperty('--out-pct',((outCue/fileDur)*100).toFixed(1)+'%');
    }
    const cdEl=document.getElementById(this.ids.body+'-cd-'+i);
    if(cdEl){
      const remToOut=outCue-pos;
      if(remToOut>0){cdEl.textContent=fmtFull(remToOut);cdEl.style.color='#ef5350';}
      else{cdEl.textContent='+ '+fmtFull(Math.abs(remToOut));cdEl.style.color='#ffa726';}
    }
    const pb=document.getElementById('d2-progress-fill');if(pb)pb.style.width=(progFull*100).toFixed(2)+'%';
    const micros=document.getElementById(this.ids.micros);if(micros)micros.textContent=fmtMs(pos-inCue);
    paintStripFromVU();
  }

  _startTrack(i){
    const t=this.tracks[i];if(!t)return;
    // ── PAS MACRO : token incrémenté, exécuter, puis passer au suivant ──
    if(t.isMacro){
      const token=++this._playToken;
      if(this._outTimer){clearTimeout(this._outTimer);this._outTimer=null;}
      if(this._removeTimer){clearTimeout(this._removeTimer);this._removeTimer=null;}
      this.ci=i;this.render();
      if(typeof t.action==='function') t.action(this);
      this._outTimer=setTimeout(()=>{
        if(token!==this._playToken||!this.playing)return;
        const idx=this.tracks.indexOf(t);
        if(idx!==-1){this.tracks.splice(idx,1);this.durs.splice(idx,1);this.audios.splice(idx,1);}
        this._updateFdzCount();
        if(this.tracks.length){this.ci=0;this._startTrack(0);}
        else{this.ci=0;this.playing=false;}
        this.render();
      },1500);
      return;
    }
    const audio=this.audios[i];if(!audio)return;
    const token=++this._playToken;audio.onended=null;
    if(this._outTimer){clearTimeout(this._outTimer);this._outTimer=null;}
    if(this._removeTimer){clearTimeout(this._removeTimer);this._removeTimer=null;}
    const inCue=this._inOf(i),outCue=this._outOf(i),fileDur=this.durs[i]||0;
    const chainDelay=Math.max(0,outCue-inCue);
    audio.currentTime=inCue;this.ci=i;

    // Point OUT = ENCHAÎNEMENT — le son courant continue en fond jusqu'à sa fin naturelle
    this._outTimer=setTimeout(()=>{
      if(!this.playing)return;
      if(!this._stopAfterMacro && this.tracks.length>1) this._startNextAfterChain();
      const remaining=Math.max(0,(fileDur-outCue))*1000;
      this._removeTimer=setTimeout(()=>{
        audio.onended=null;if(!audio.paused)audio.pause();
        const idx=this.tracks.indexOf(t);
        if(idx!==-1){if(t.file?.startsWith('blob:'))URL.revokeObjectURL(t.file);this.tracks.splice(idx,1);this.durs.splice(idx,1);this.audios.splice(idx,1);}
        this.ci=0;this._updateFdzCount();this.render();
      }, remaining+300);
    },chainDelay*1000);

    audio.onended=()=>{
      audio.onended=null;
      if(this._removeTimer){clearTimeout(this._removeTimer);this._removeTimer=null;}
      if(this._outTimer){
        clearTimeout(this._outTimer);this._outTimer=null;
        if(this.playing && !this._stopAfterMacro && this.tracks.length>1) this._startNextAfterChain();
      }
      const idx=this.tracks.indexOf(t);
      if(idx!==-1){if(t.file?.startsWith('blob:'))URL.revokeObjectURL(t.file);this.tracks.splice(idx,1);this.durs.splice(idx,1);this.audios.splice(idx,1);}
      this.ci=0;this._updateFdzCount();this.render();
    };

    audio.play().then(()=>wireAudio(audio)).catch(e=>{audio.onended=null;if(this._outTimer){clearTimeout(this._outTimer);this._outTimer=null;}console.warn('play() error:',e);});
  }

  _startNextAfterChain(){
    if(!this.playing)return;
    for(let j=0;j<this.tracks.length;j++){
      const nt=this.tracks[j];const na=this.audios[j];
      if(nt.isMacro){this._startTrack(j);return;}
      if(na&&na.paused){this._startTrack(j);return;}
    }
  }

  _updateFdzCount(){
    const n=this.tracks.length;const el=document.getElementById(this.cfg.fdzCount);
    if(el)el.textContent=n?n+' fichier'+(n>1?'s':''):'Aucun fichier';
  }

  togglePlay(){
    if(!this.tracks.length)return;
    const hasAudio=this.tracks.some(t=>!t.isMacro);if(!hasAudio)return;
    if(!this.playing){this._stopAfterMacro=false;this.playing=true;this.ci=0;this._chainDone.clear();this._startTrack(0);this.render();}
    else{this._playToken++;if(this._outTimer){clearTimeout(this._outTimer);this._outTimer=null;}if(this._removeTimer){clearTimeout(this._removeTimer);this._removeTimer=null;}this.audios.forEach(a=>{if(a){a.onended=null;if(!a.paused)a.pause();}});this._stopAfterMacro=false;this.playing=false;this.render();}
  }
  stopAll(){
    this._playToken++;if(this._outTimer){clearTimeout(this._outTimer);this._outTimer=null;}if(this._removeTimer){clearTimeout(this._removeTimer);this._removeTimer=null;}
    this.audios.forEach(a=>{if(a){a.onended=null;if(!a.paused)a.pause();a.currentTime=0;}});
    this._stopAfterMacro=false;this.playing=false;this.ci=0;this._chainDone.clear();
    const pb=document.getElementById('d2-progress-fill');if(pb)pb.style.width='0%';
    this.render();
  }
  toggleAuto(){this.auto=!this.auto;const btn=document.getElementById(this.cfg.autoBtn);if(btn)btn.classList.toggle('active',this.auto);}
  nextTrack(){}
  prevTrack(){}
  jumpTo(i){if(this.playing){this.audios.forEach(a=>{if(a&&!a.paused)a.pause();});this.ci=i;this._chainDone.clear();this._startTrack(i);}else{this.ci=i;}this.render();}
}

const D=[new Diffuser(CONFIGS[0],0)];

// ═══════════════════════════════════════════════════════
// FICHIERS / DROP
// ═══════════════════════════════════════════════════════
const D2_COLORS=['#1a6b3a','#1a3a6e','#5b21b6','#6b3a1a','#1a5a6b','#3a1a6b','#6b5a1a'];
function handleFiles2(files){
  const arr=Array.from(files).filter(f=>f.type.startsWith('audio/'));if(!arr.length)return;
  const newTracks=arr.map((f,i)=>({file:URL.createObjectURL(f),title:f.name.replace(/\.[^/.]+$/,''),color:D2_COLORS[i%D2_COLORS.length],inCue:0,outCue:null}));
  D[0].addTracks(newTracks);
}
function handleDrop2(e){
  e.preventDefault();document.getElementById('fdz-d2')?.classList.remove('drag-over');
  handleFiles2((e.dataTransfer&&e.dataTransfer.files)||[]);
}
function diffRemoveTrack(diffIdx,trackIdx){
  const d=D[diffIdx];if(!d)return;
  d.tracks.splice(trackIdx,1);d.durs.splice(trackIdx,1);d.audios.splice(trackIdx,1);
  d.ci=0;d._updateFdzCount();d.render();
}

// ═══════════════════════════════════════════════════════
// WEBAUDIO / VU
// ═══════════════════════════════════════════════════════
let _audioCtx=null;
function getCtx(){if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(_audioCtx.state==='suspended')_audioCtx.resume();return _audioCtx;}
let _masterGn=null,vu0=null;
function wireAudio(el){
  if(!el)return;if(el._wired)return;el._wired=true;
  const ctx=getCtx();
  if(!_masterGn){
    _masterGn=ctx.createGain();_masterGn.gain.value=1;
    const sp=ctx.createChannelSplitter(2);const aL=ctx.createAnalyser(),aR=ctx.createAnalyser();
    aL.fftSize=1024;aR.fftSize=1024;aL.smoothingTimeConstant=0.8;aR.smoothingTimeConstant=0.8;
    _masterGn.connect(sp);sp.connect(aL,0);sp.connect(aR,1);_masterGn.connect(ctx.destination);
    vu0={aL,aR};
  }
  try{const src=ctx.createMediaElementSource(el);src.connect(_masterGn);}catch(e){console.warn('[wire]',e.message);}
}
function paintStripFromVU(){
  if(!vu0)return;const el=document.getElementById('vu-strip-d2');if(!el)return;
  const bars=el.querySelectorAll('.vu-strip-bar');if(!bars.length)return;
  const data=new Float32Array(vu0.aL.fftSize);vu0.aL.getFloatTimeDomainData(data);
  let s=0;for(const v of data)s+=v*v;
  const rms=Math.sqrt(s/data.length);const db=rms>0?Math.max(-60,20*Math.log10(rms)):-60;
  const active=Math.round(((db+60)/60)*bars.length);
  bars.forEach((b,i)=>b.style.opacity=i<active?'1':'0.08');
}

// ═══════════════════════════════════════════════════════
// BOUCLE PRINCIPALE
// ═══════════════════════════════════════════════════════
function mainLoop(){
  requestAnimationFrame(mainLoop);
  D.forEach(d=>d.tick());
  const sec=new Date().getSeconds();
  if(sec!==_lastClockSec){
    _lastClockSec=sec;const clk=document.getElementById('clock');if(clk)clk.textContent=nowClock();
  }
}

function _onReady(){
  D[0].render();
  mainLoop();
  initSignaling();
  // Resume AudioContext au PLAY
  const _orig=D[0].togglePlay.bind(D[0]);
  D[0].togglePlay=function(){getCtx().resume();_orig();};
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',_onReady);}
else{_onReady();}
</script>
